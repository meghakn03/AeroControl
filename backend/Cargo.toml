[package]
name = "aerocontrol"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tonic = "0.12"
tonic-web = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
