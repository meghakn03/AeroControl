services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '127.0.0.1:${AEROCONTROL_GRPC_PORT:-50051}:50051'
    init: true
    restart: unless-stopped
    environment:
      RUST_LOG: info
  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:${AEROCONTROL_WEB_PORT:-8088}:80'
    depends_on:
      - backend
    restart: unless-stopped
